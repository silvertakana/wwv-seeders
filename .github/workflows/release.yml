name: Build and Release Seeders

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9
          
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'pnpm'
          
      - name: Install dependencies
        run: pnpm install
        
      - name: Build seeders
        run: pnpm run build
        
      - name: Package seeders
        run: |
          mkdir -p staging
          cd packages
          for dir in */; do
            # Skip shared packages or those without dist
            if [ -d "$dir/dist" ] && [ "$dir" != "shared/" ]; then
              mkdir -p "../staging/$dir/dist"
              cp "$dir/dist/index.mjs" "../staging/$dir/dist/"
              if [ -f "$dir/package.json" ]; then
                cp "$dir/package.json" "../staging/$dir/"
              fi
            fi
          done
          cd ../staging
          zip -r ../seeders.zip .
          
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: seeders.zip
          tag_name: "v1.0.${{ github.run_number }}"
          name: "Community Seeders v1.0.${{ github.run_number }}"
          generate_release_notes: true

      - name: Trigger Coolify API Service Restart
        run: |
          curl -fsS -X POST "https://coolify.worldwideview.dev/api/v1/applications/1a7d3f54da3e2adc42453893/restart" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_API_TOKEN }}" \
            -H "Content-Type: application/json"

      - name: Verify Engine Health and ISS Data
        run: |
          set -euo pipefail
          ENGINE="https://dataenginev2.worldwideview.dev"

          echo "Waiting for the engine to come back after the seeder release restart..."
          healthy=0
          code="000"
          for i in $(seq 1 36); do
            code=$(curl -sS -o /dev/null -w "%{http_code}" "$ENGINE/health" 2>/dev/null || echo "000")
            if [ "$code" = "200" ]; then
              healthy=1
              echo "Engine healthy after $((i * 5))s (HTTP 200)"
              break
            fi
            sleep 5
          done
          if [ "$healthy" != "1" ]; then
            echo "::error::Engine did not return HTTP 200 within 180s (last: HTTP $code)."
            exit 1
          fi

          # The seeder SDK throttles the Redis snapshot write to one per 5 minutes
          # while broadcasting every fix over WebSocket, so the persisted ISS
          # timestamp only advances across that window. Wait it out rather than
          # trusting this workflow's own green tick.
          read_iss_timestamp() {
            curl -sS --max-time 10 "$ENGINE/api/iss" 2>/dev/null | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const j=JSON.parse(s);const t=j?.items?.[0]?.timestamp;process.stdout.write(typeof t==="number"?String(Math.floor(t)):"");}catch{process.stdout.write("");}})'
          }

          first=$(read_iss_timestamp)
          if [ -z "$first" ]; then
            echo "::error::/api/iss returned no usable position; the seeder did not publish."
            exit 1
          fi
          echo "First ISS timestamp: $first"

          advanced=0
          for i in $(seq 1 40); do
            sleep 10
            now=$(read_iss_timestamp)
            if [ -n "$now" ] && [ "$now" -gt "$first" ]; then
              echo "ISS timestamp advanced to $now after $((i * 10))s"
              advanced=1
              break
            fi
          done
          if [ "$advanced" != "1" ]; then
            echo "::error::ISS snapshot did not advance within 400s; the published data is stale."
            exit 1
          fi
          echo "Engine healthy and the ISS snapshot is advancing."
