name: Build and Release Seeders

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9
          
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'pnpm'
          
      # The gate that guards this workflow has its own tests, and it needs no
      # dependencies, so it runs before the install it does not need.
      - name: Test the release gate
        run: node --test scripts/verify-iss-release.test.mjs

      - name: Install dependencies
        run: pnpm install
        
      - name: Build seeders
        run: pnpm run build
        
      - name: Package seeders
        run: |
          mkdir -p staging
          cd packages
          for dir in */; do
            # Skip shared packages or those without dist
            if [ -d "$dir/dist" ] && [ "$dir" != "shared/" ]; then
              mkdir -p "../staging/$dir/dist"
              cp "$dir/dist/index.mjs" "../staging/$dir/dist/"
              if [ -f "$dir/package.json" ]; then
                cp "$dir/package.json" "../staging/$dir/"
              fi
            fi
          done
          cd ../staging
          zip -r ../seeders.zip .
          
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: seeders.zip
          tag_name: "v1.0.${{ github.run_number }}"
          name: "Community Seeders v1.0.${{ github.run_number }}"
          generate_release_notes: true

      - name: Trigger Coolify API Service Restart
        timeout-minutes: 1
        env:
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          set -euo pipefail
          curl -fsS --connect-timeout 5 --max-time 30 -X POST \
            "https://coolify.worldwideview.dev/api/v1/applications/1a7d3f54da3e2adc42453893/restart" \
            -H "Authorization: Bearer $COOLIFY_API_TOKEN" \
            -H "Content-Type: application/json"

      - name: Verify the engine serves fresh, advancing ISS data
        timeout-minutes: 12
        run: node scripts/verify-iss-release.mjs https://dataenginev2.worldwideview.dev
