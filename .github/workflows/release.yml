name: Build and Release Seeders

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          
      - name: Install dependencies
        run: pnpm install
        
      - name: Build seeders
        run: pnpm run build
        
      - name: Package seeders
        run: |
          mkdir -p staging
          cd packages
          for dir in */; do
            # Skip shared packages or those without dist
            if [ -d "$dir/dist" ] && [ "$dir" != "shared/" ]; then
              mkdir -p "../staging/$dir/dist"
              cp "$dir/dist/index.mjs" "../staging/$dir/dist/"
              if [ -f "$dir/package.json" ]; then
                cp "$dir/package.json" "../staging/$dir/"
              fi
            fi
          done
          cd ../staging
          zip -r ../seeders.zip .
          
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: seeders.zip
          tag_name: "v1.0.${{ github.run_number }}"
          name: "Community Seeders v1.0.${{ github.run_number }}"
          generate_release_notes: true

      - name: Trigger Coolify API Service Restart
        run: |
          curl -sS -X POST "https://coolify.worldwideview.dev/api/v1/services/slv47hjfvip5h1xggsc3yenm/restart" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_API_TOKEN }}" \
            -H "Content-Type: application/json"

      - name: Verify Engine Health (Prevent 502 Trap)
        run: |
          echo "Waiting for engine to restart..."
          sleep 30
          check_health() {
            curl -sS -o /dev/null -w "%{http_code}" "https://dataenginev2.worldwideview.dev/health" 2>/dev/null || echo "000"
          }
          HEALTH=$(check_health)
          echo "Health check: HTTP $HEALTH"
          if [ "$HEALTH" != "200" ]; then
            echo "⚠ Engine not healthy. Retrying restart..."
            curl -sS -X POST "https://coolify.worldwideview.dev/api/v1/services/slv47hjfvip5h1xggsc3yenm/restart" \
              -H "Authorization: Bearer ${{ secrets.COOLIFY_API_TOKEN }}" \
              -H "Content-Type: application/json"
            sleep 30
            HEALTH=$(check_health)
            echo "Health check after retry: HTTP $HEALTH"
          fi
          if [ "$HEALTH" = "200" ]; then
            echo "✅ Engine healthy"
          else
            echo "::warning::Engine unhealthy (HTTP $HEALTH). Manual compose restart may be needed: ssh root@server 'docker compose -f /data/coolify/services/slv47hjfvip5h1xggsc3yenm/docker-compose.yml up -d'"
          fi